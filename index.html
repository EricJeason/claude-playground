<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>暮谷镇 · Murk Valley</title>
  <meta name="viewport" content="width=1280">
  <meta name="description" content="A generative NPC social-simulation prototype.">

  <!-- Google Fonts: serif title, hand body, mono numerals. swap = avoid FOIT. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Kalam:wght@300;400;700&family=Caveat:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/styles.css">

  <!-- React 18 + Babel standalone, no build step. -->

  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="stage">
